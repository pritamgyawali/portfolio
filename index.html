<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pritam Gyawali - Computer Engineer</title>
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
(function() {
var canvas = document.getElementById('matrix-bg');
var ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
var fontSize = 16;
var columns = Math.floor(canvas.width / fontSize);
var verticalSpacing = fontSize * 1.5;
var drops = [];
for (var i = 0; i < columns; i++) { drops[i] = Math.random() * -100; }
ctx.font = fontSize + 'px monospace';
function draw() {
ctx.fillStyle = 'rgba(0, 5, 15, 0.08)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
for (var i = 0; i < drops.length; i++) {
var text = Math.random() > 0.5 ? '1' : '0';
var brightness = Math.random();
if (brightness > 0.95) {
ctx.fillStyle = '#00d4ff';
ctx.shadowColor = '#00d4ff';
ctx.shadowBlur = 15;
} else if (brightness > 0.8) {
ctx.fillStyle = '#0099cc';
ctx.shadowColor = '#0099cc';
ctx.shadowBlur = 8;
} else {
ctx.fillStyle = 'rgba(0, 120, 200, 0.5)';
ctx.shadowColor = 'transparent';
ctx.shadowBlur = 0;
}
ctx.fillText(text, i * fontSize, drops[i] * verticalSpacing);
drops[i] += 0.325;
if (drops[i] * verticalSpacing > canvas.height && Math.random() > 0.97) { drops[i] = 0; }
}
ctx.shadowBlur = 0;
}
setInterval(draw, 33);
window.addEventListener('resize', function() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
columns = Math.floor(canvas.width / fontSize);
drops.length = columns;
for (var i = 0; i < columns; i++) { if (drops[i] === undefined) drops[i] = Math.random() * -100; }
});
})();
</script>
</body>
</html>
